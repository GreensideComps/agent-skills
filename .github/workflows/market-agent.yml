# Hosted Trading 212 DEMO market agent: runs whether or not any Claude session is awake.
# How it works and how to hand over: ops/market-agent-host/README.md.
#
# Each run lasts up to ~5.5 h; a run is queued every 20 min on weekdays, and the concurrency group keeps exactly one
# running with at most one waiting, so the next run takes over within a couple of minutes of the previous one ending.
# The runner only trades while the `market-agent-state` branch says host=github-actions.
# Needs repository secrets T212_API_KEY and T212_API_SECRET (the DEMO key pair). Without them every run exits quietly.
name: market-agent
on:
  schedule:
    - cron: "*/20 5-20 * * 1-5"   # 05:00-21:00 UTC weekdays; each run stops at 21:15 UTC (after the US close)
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Minutes to run (max ~335)"
        default: "330"
permissions:
  contents: write                  # push the encrypted state snapshot to the market-agent-state branch
concurrency:
  group: market-agent
  cancel-in-progress: false
env:
  AGENT_REF: claude/research-office-plan-sseamv   # the office thread's deploy branch; new commits restart the agent
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet requests pandas
      - name: Prepare the project root
        run: sudo mkdir -p /mnt/project-files && sudo chown "$USER" /mnt/project-files
      - name: Run the market agent
        env:
          T212_ENV: demo
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min || '330' }}
        run: >
          python ops/market-agent-host/hostctl.py run
          --root /mnt/project-files
          --agent-ref "$AGENT_REF"
          --code-dir "$RUNNER_TEMP/ma-code"
          --budget-min "$BUDGET_MIN"
          --until 21:15
